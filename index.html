<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEOX — SEO Auditor</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:        #080d1a;
      --navy-mid:    #0e1628;
      --navy-card:   #111b30;
      --navy-glass:  rgba(14, 22, 40, 0.75);
      --border:      rgba(120, 160, 255, 0.1);
      --border-hot:  rgba(180, 0, 255, 0.35);
      --neon-purple: #b400ff;
      --neon-red:    #ff003c;
      --neon-pink:   #ff0080;
      --green:       #00e5a0;
      --amber:       #ffaa00;
      --text:        #dce8ff;
      --muted:       rgba(180, 210, 255, 0.38);
      --mono:        'DM Mono', monospace;
      --display:     'Orbitron', sans-serif;
      --body:        'Rajdhani', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--body);
      background: var(--navy);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Noise texture overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Atmospheric radial — top right only ── */
    body::after {
      content: '';
      position: fixed;
      top: -300px;
      right: -200px;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(100, 0, 255, 0.07) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 3rem 2rem 8rem;
    }

    /* ══════════════════════════════════════
       HEADER
    ══════════════════════════════════════ */
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding-bottom: 2.5rem;
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--border);
      animation: fadeDown 0.5s ease both;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-wrap { display: flex; flex-direction: column; gap: 0.4rem; }

    .logo {
      font-family: var(--display);
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(120deg, #ff003c 0%, #b400ff 55%, #ff0080 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 18px rgba(180,0,255,0.4));
    }

    .tagline {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    #timestamp {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.12em;
    }

    /* ══════════════════════════════════════
       INPUT BAR
    ══════════════════════════════════════ */
    .audit-form {
      display: flex;
      gap: 0;
      margin-bottom: 2.5rem;
      position: relative;
      animation: fadeDown 0.5s 0.1s ease both;
    }

    .input-prefix {
      display: flex;
      align-items: center;
      padding: 0 1rem;
      background: var(--navy-card);
      border: 1px solid var(--border);
      border-right: none;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--neon-purple);
      letter-spacing: 0.05em;
      user-select: none;
      flex-shrink: 0;
    }

    #site-url {
      flex: 1;
      background: var(--navy-card);
      border: 1px solid var(--border);
      border-right: none;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.88rem;
      padding: 1rem 1.2rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      letter-spacing: 0.04em;
    }

    #site-url::placeholder { color: var(--muted); }

    #site-url:focus {
      border-color: var(--border-hot);
      box-shadow: 0 0 0 1px rgba(180,0,255,0.2) inset;
    }

    #audit-btn {
      background: linear-gradient(135deg, #c200ff, #ff003c);
      border: none;
      color: #fff;
      font-family: var(--display);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 1rem 2.2rem;
      cursor: pointer;
      transition: filter 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    #audit-btn:hover  { filter: brightness(1.25); }
    #audit-btn:active { transform: scale(0.98); }
    #audit-btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }

    /* ══════════════════════════════════════
       STATUS BAR
    ══════════════════════════════════════ */
    #status-bar {
      font-family: var(--mono);
      font-size: 0.74rem;
      color: var(--neon-purple);
      margin-bottom: 2rem;
      min-height: 1.1rem;
      letter-spacing: 0.1em;
      display: none;
      align-items: center;
      gap: 0.6rem;
    }

    #status-bar.visible { display: flex; }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--neon-purple);
      flex-shrink: 0;
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--neon-purple); }
      50%       { opacity: 0.25; box-shadow: none; }
    }

    /* ══════════════════════════════════════
       ERROR
    ══════════════════════════════════════ */
    #error-msg {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--neon-red);
      padding: 0.9rem 1.2rem;
      border: 1px solid rgba(255,0,60,0.25);
      background: rgba(255,0,60,0.05);
      display: none;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }

    #error-msg.visible { display: block; }

    /* ══════════════════════════════════════
       SUMMARY
    ══════════════════════════════════════ */
    #summary {
      display: none;
      background: var(--navy-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 2rem 2.5rem;
      margin-bottom: 2.5rem;
      position: relative;
      overflow: hidden;
    }

    #summary::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--neon-red), var(--neon-purple), var(--neon-pink));
    }

    #summary.visible {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 1.5rem;
      animation: fadeUp 0.4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .summary-stat { text-align: center; }

    .summary-stat .val {
      font-family: var(--display);
      font-size: 2.4rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-red), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: block;
      line-height: 1;
    }

    .summary-stat .lbl {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 0.4rem;
      display: block;
    }

    /* ══════════════════════════════════════
       PAGE CARDS
    ══════════════════════════════════════ */
    .page-card {
      background: var(--navy-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      padding: 1.8rem 2rem;
      margin-bottom: 0.85rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, background 0.2s;
      animation: cardIn 0.4s ease both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .page-card:hover {
      background: rgba(14, 22, 40, 0.9);
      border-color: rgba(120, 160, 255, 0.2);
    }

    /* Grade left border colors */
    .card-grade-A .page-card { border-left-color: var(--green); }
    .card-grade-B .page-card { border-left-color: var(--neon-purple); }
    .card-grade-C .page-card { border-left-color: var(--amber); }
    .card-grade-D .page-card { border-left-color: var(--neon-red); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.4rem;
      gap: 1.5rem;
    }

    .page-id {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .page-title {
      font-family: var(--body);
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.25rem;
      line-height: 1.3;
    }

    .page-slug {
      font-family: var(--mono);
      font-size: 0.67rem;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    /* Score badge */
    .score-badge { text-align: right; flex-shrink: 0; }

    .score-num {
      font-family: var(--display);
      font-size: 2.6rem;
      font-weight: 900;
      line-height: 1;
      display: block;
    }

    .card-grade-A .score-num { color: var(--green);       text-shadow: 0 0 20px rgba(0,229,160,0.5); }
    .card-grade-B .score-num { color: var(--neon-purple);  text-shadow: 0 0 20px rgba(180,0,255,0.5); }
    .card-grade-C .score-num { color: var(--amber);        text-shadow: 0 0 20px rgba(255,170,0,0.5); }
    .card-grade-D .score-num { color: var(--neon-red);     text-shadow: 0 0 20px rgba(255,0,60,0.5); }

    .score-grade {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }

    /* ── Metric Pills ── */
    .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .metric {
      font-family: var(--mono);
      font-size: 0.64rem;
      letter-spacing: 0.04em;
      padding: 0.3rem 0.7rem;
      border-radius: 3px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .metric.pass {
      background: rgba(0, 229, 160, 0.08);
      color: rgba(0, 229, 160, 0.85);
      border: 1px solid rgba(0, 229, 160, 0.2);
    }

    .metric.partial {
      background: rgba(255, 170, 0, 0.08);
      color: rgba(255, 170, 0, 0.85);
      border: 1px solid rgba(255, 170, 0, 0.2);
    }

    .metric.fail {
      background: rgba(255, 0, 60, 0.07);
      color: rgba(255, 80, 110, 0.85);
      border: 1px solid rgba(255, 0, 60, 0.2);
    }

    /* Score bar */
    .score-bar-wrap {
      margin-top: 1.4rem;
      height: 2px;
      background: rgba(255,255,255,0.04);
      position: relative;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      transition: width 0.9s cubic-bezier(0.4,0,0.2,1);
    }

    .card-grade-A .score-bar-fill { background: linear-gradient(90deg, var(--green), #00ffcc); }
    .card-grade-B .score-bar-fill { background: linear-gradient(90deg, #7b00ff, var(--neon-purple)); }
    .card-grade-C .score-bar-fill { background: linear-gradient(90deg, #ff6a00, var(--amber)); }
    .card-grade-D .score-bar-fill { background: linear-gradient(90deg, var(--neon-red), var(--neon-pink)); }

    /* ══════════════════════════════════════
       SCROLLBAR
    ══════════════════════════════════════ */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--navy); }
    ::-webkit-scrollbar-thumb { background: rgba(180,0,255,0.4); border-radius: 3px; }

    /* ══════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════ */
    @media (max-width: 620px) {
      .logo { font-size: 1.5rem; }
      .audit-form { flex-wrap: wrap; }
      .input-prefix { display: none; }
      #site-url { border-right: 1px solid var(--border); }
      #audit-btn { width: 100%; justify-content: center; }
      .card-top { flex-direction: column; }
      .score-badge { text-align: left; }
      .metric { font-size: 0.6rem; }
    }
  </style>
</head>
<body>

<div class="wrapper">
  <header>
    <div class="logo-wrap">
      <div class="logo">SEOX</div>
      <div class="tagline">On-Page SEO Auditor — Any Platform</div>
    </div>
    <div id="timestamp"></div>
  </header>

  <div class="audit-form">
    <div class="input-prefix">https://</div>
    <input type="text" id="site-url" placeholder="yourwebsite.com" />
    <button id="audit-btn">Run Audit</button>
  </div>

  <div id="status-bar"><span class="status-dot"></span><span id="status-text">Initializing...</span></div>
  <div id="error-msg"></div>
  <div id="summary"></div>
  <div id="pages-container"></div>
</div>

<script>
  // ─── Utilities ────────────────────────────────────────────────
  const $ = id => document.getElementById(id);

  function setStatus(msg) {
    $('status-bar').classList.add('visible');
    $('status-text').textContent = msg;
  }

  function clearStatus() {
    $('status-bar').classList.remove('visible');
  }

  function showError(msg) {
    const el = $('error-msg');
    el.textContent = '// ERROR: ' + msg;
    el.classList.add('visible');
  }

  function hideError() {
    $('error-msg').classList.remove('visible');
  }

  // ─── Fetch page HTML via our Netlify function ─────────────────
  async function fetchHTML(url) {
  const endpoint = `/api/fetch-page?url=${encodeURIComponent(url)}`;
  const res = await fetch(endpoint);
  if (!res.ok) throw new Error(`Function returned ${res.status}`);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  // Return full data object — callers that only need html still work
  return { html: data.html, responseTime: data.responseTime || 0, sizeKb: data.sizeKb || 0 };
}

  // ─── HTML Parsers ─────────────────────────────────────────────
  function parseHTML(html) {
    const parser = new DOMParser();
    return parser.parseFromString(html, 'text/html');
  }

  function getTitle(doc) {
    return (doc.querySelector('title')?.textContent || '').trim();
  }

  function getMetaDescription(doc) {
    return (doc.querySelector('meta[name="description"]')?.getAttribute('content') || '').trim();
  }

  function getH1s(doc)  { return doc.querySelectorAll('h1'); }
  function getH2s(doc)  { return doc.querySelectorAll('h2'); }
  function getH3s(doc)  { return doc.querySelectorAll('h3'); }
  function getImages(doc) { return doc.querySelectorAll('img'); }

  function getCanonical(doc) {
    return doc.querySelector('link[rel="canonical"]')?.getAttribute('href') || '';
  }

  function getRobotsMeta(doc) {
    return doc.querySelector('meta[name="robots"]')?.getAttribute('content') || '';
  }

  function hasSchema(doc) {
    return !!doc.querySelector('script[type="application/ld+json"]');
  }

  function getWordCount(doc) {
    const body = doc.body?.innerText || doc.body?.textContent || '';
    return body.trim().split(/\s+/).filter(w => w.length > 0).length;
  }

  function getInternalLinks(doc, domain) {
    const links = doc.querySelectorAll('a[href]');
    let internal = 0;
    links.forEach(link => {
      const href = link.getAttribute('href') || '';
      if (href.includes(domain) || href.startsWith('/')) internal++;
    });
    return internal;
  }

  function getExternalLinks(doc, domain) {
    const links = doc.querySelectorAll('a[href]');
    let external = 0;
    links.forEach(link => {
      const href = link.getAttribute('href') || '';
      if (href.startsWith('http') && !href.includes(domain)) external++;
    });
    return external;
  }

  function getViewport(doc) {
    return doc.querySelector('meta[name="viewport"]')?.getAttribute('content') || '';
  }

  function getOpenGraph(doc) {
    const ogTitle = doc.querySelector('meta[property="og:title"]')?.getAttribute('content') || '';
    const ogDesc  = doc.querySelector('meta[property="og:description"]')?.getAttribute('content') || '';
    const ogImage = doc.querySelector('meta[property="og:image"]')?.getAttribute('content') || '';
    return { ogTitle, ogDesc, ogImage };
  }
  function getTwitterCard(doc) {
  const card  = doc.querySelector('meta[name="twitter:card"]')?.getAttribute('content') || '';
  const title = doc.querySelector('meta[name="twitter:title"]')?.getAttribute('content') || '';
  return { card, title };
}

function isRobotsBlocked(robotsTxt, path) {
  if (!robotsTxt) return false;
  const lines = robotsTxt.split('\n').map(l => l.trim().toLowerCase());
  let applicable = false;
  for (const line of lines) {
    if (line.startsWith('user-agent:')) {
      applicable = line.includes('*') || line.includes('googlebot');
    }
    if (applicable && line.startsWith('disallow:')) {
      const rule = line.replace('disallow:', '').trim();
      if (rule && path.toLowerCase().startsWith(rule)) return true;
    }
  }
  return false;
}

  function isSlugClean(slug) {
    const stopWords = ['and','the','of','in','a','to','for','on','with','is','it','at','by','or'];
    const parts = slug.split('-').filter(Boolean);
    const hasStop  = parts.some(p => stopWords.includes(p.toLowerCase()));
    const tooLong  = slug.length > 75;
    const hasNumbers = /\d{4,}/.test(slug);
    return !hasStop && !tooLong && !hasNumbers;
  }

  // ─── Scoring Engine ───────────────────────────────────────────
  function scorePage(doc, url, domain, responseTime = 0, sizeKb = 0) {
    const metrics = [];
    let score = 0;

    const title         = getTitle(doc);
    const metaDesc      = getMetaDescription(doc);
    const h1s           = getH1s(doc);
    const h2s           = getH2s(doc);
    const h3s           = getH3s(doc);
    const images        = getImages(doc);
    const canonical     = getCanonical(doc);
    const robots        = getRobotsMeta(doc);
    const schema        = hasSchema(doc);
    const wordCount     = getWordCount(doc);
    const internalLinks = getInternalLinks(doc, domain);
    const externalLinks = getExternalLinks(doc, domain);
    const viewport      = getViewport(doc);
    const og            = getOpenGraph(doc);

    const urlObj = new URL(url);
    const slug   = urlObj.pathname.replace(/^\/|\/$/g, '') || 'homepage';
    const imagesWithAlt = Array.from(images).filter(img => (img.getAttribute('alt') || '').trim().length > 1);

    // 1. Title — 10pts
    if (title && title.length >= 30 && title.length <= 60) {
      score += 10; metrics.push({ label: `Title (${title.length} chars)`, pass: 'pass' });
    } else if (title && title.length > 0) {
      score += 5;  metrics.push({ label: `Title (${title.length} chars)`, pass: 'partial' });
    } else {
      metrics.push({ label: 'Title missing', pass: 'fail' });
    }

    // 2. Meta description — 10pts
    if (metaDesc && metaDesc.length >= 120 && metaDesc.length <= 160) {
      score += 10; metrics.push({ label: `Meta desc (${metaDesc.length} chars)`, pass: 'pass' });
    } else if (metaDesc && metaDesc.length > 0) {
      score += 5;  metrics.push({ label: `Meta desc (${metaDesc.length} chars)`, pass: 'partial' });
    } else {
      metrics.push({ label: 'Meta desc missing', pass: 'fail' });
    }

    // 3. H1 — 10pts
    if (h1s.length === 1) {
      score += 10; metrics.push({ label: 'H1 (1 found)', pass: 'pass' });
    } else if (h1s.length > 1) {
      score += 4;  metrics.push({ label: `H1 overused (${h1s.length})`, pass: 'partial' });
    } else {
      metrics.push({ label: 'No H1 tag', pass: 'fail' });
    }

    // 4. H2/H3 — 5pts
    if (h2s.length >= 2) {
      score += 5; metrics.push({ label: `${h2s.length} H2s / ${h3s.length} H3s`, pass: 'pass' });
    } else if (h2s.length === 1) {
      score += 3; metrics.push({ label: `${h2s.length} H2 only`, pass: 'partial' });
    } else {
      metrics.push({ label: 'No H2/H3', pass: 'fail' });
    }

    // 5. Word count — 10pts
    if (wordCount >= 600) {
      score += 10; metrics.push({ label: `${wordCount} words`, pass: 'pass' });
    } else if (wordCount >= 200) {
      score += 5;  metrics.push({ label: `${wordCount} words (thin)`, pass: 'partial' });
    } else {
      metrics.push({ label: `${wordCount} words (very thin)`, pass: 'fail' });
    }

    // 6. Image alt — 10pts
    if (images.length === 0) {
      score += 5; metrics.push({ label: 'No images', pass: 'partial' });
    } else if (imagesWithAlt.length === images.length) {
      score += 10; metrics.push({ label: `Alt text ${imagesWithAlt.length}/${images.length}`, pass: 'pass' });
    } else if (imagesWithAlt.length > 0) {
      score += 5;  metrics.push({ label: `Alt text ${imagesWithAlt.length}/${images.length}`, pass: 'partial' });
    } else {
      metrics.push({ label: `No alt text (0/${images.length})`, pass: 'fail' });
    }

    // 7. Internal links — 8pts
    if (internalLinks >= 5) {
      score += 8; metrics.push({ label: `${internalLinks} internal links`, pass: 'pass' });
    } else if (internalLinks >= 2) {
      score += 4; metrics.push({ label: `${internalLinks} internal links`, pass: 'partial' });
    } else {
      metrics.push({ label: 'No internal links', pass: 'fail' });
    }

    // 8. External links — 4pts
    if (externalLinks >= 1) {
      score += 4; metrics.push({ label: `${externalLinks} external links`, pass: 'pass' });
    } else {
      metrics.push({ label: 'No external links', pass: 'fail' });
    }

    // 9. Canonical — 8pts
    if (canonical) {
      score += 8; metrics.push({ label: 'Canonical set', pass: 'pass' });
    } else {
      metrics.push({ label: 'No canonical', pass: 'fail' });
    }

    // 10. Robots — 5pts
    if (!robots || (!robots.includes('noindex') && !robots.includes('nofollow'))) {
      score += 5; metrics.push({ label: 'Indexable', pass: 'pass' });
    } else {
      metrics.push({ label: `Robots: ${robots}`, pass: 'fail' });
    }

    // 11. Schema — 5pts
    if (schema) {
      score += 5; metrics.push({ label: 'Schema (JSON-LD)', pass: 'pass' });
    } else {
      metrics.push({ label: 'No schema', pass: 'fail' });
    }

    // 12. Viewport — 5pts
    if (viewport && viewport.includes('width=device-width')) {
      score += 5; metrics.push({ label: 'Mobile viewport', pass: 'pass' });
    } else {
      metrics.push({ label: 'No viewport meta', pass: 'fail' });
    }

    // 13. Open Graph — 5pts
    if (og.ogTitle && og.ogImage) {
      score += 5; metrics.push({ label: 'Open Graph set', pass: 'pass' });
    } else if (og.ogTitle || og.ogImage) {
      score += 2; metrics.push({ label: 'Open Graph partial', pass: 'partial' });
    } else {
      metrics.push({ label: 'No Open Graph', pass: 'fail' });
    }

    // 14. Clean slug — 5pts
    if (slug === 'homepage' || isSlugClean(slug)) {
      score += 5; metrics.push({ label: 'Clean slug', pass: 'pass' });
    } else {
      metrics.push({ label: 'Slug needs work', pass: 'fail' });
    }

    // 15. Response time — 5pts
if (responseTime > 0 && responseTime <= 800) {
  score += 5; metrics.push({ label: `${responseTime}ms response`, pass: 'pass' });
} else if (responseTime > 800 && responseTime <= 2000) {
  score += 2; metrics.push({ label: `${responseTime}ms response (slow)`, pass: 'partial' });
} else if (responseTime > 2000) {
  metrics.push({ label: `${responseTime}ms response (critical)`, pass: 'fail' });
} else {
  metrics.push({ label: 'Response time unknown', pass: 'partial' });
}

// 16. Page size — 5pts
if (sizeKb > 0 && sizeKb <= 200) {
  score += 5; metrics.push({ label: `Page size ${sizeKb}kb`, pass: 'pass' });
} else if (sizeKb > 200 && sizeKb <= 500) {
  score += 2; metrics.push({ label: `Page size ${sizeKb}kb (heavy)`, pass: 'partial' });
} else if (sizeKb > 500) {
  metrics.push({ label: `Page size ${sizeKb}kb (critical)`, pass: 'fail' });
} else {
  metrics.push({ label: 'Page size unknown', pass: 'partial' });
}

// 17. Twitter Card — 3pts
const twitter = getTwitterCard(doc);
if (twitter.card && twitter.title) {
  score += 3; metrics.push({ label: 'Twitter Card set', pass: 'pass' });
} else if (twitter.card || twitter.title) {
  score += 1; metrics.push({ label: 'Twitter Card partial', pass: 'partial' });
} else {
  metrics.push({ label: 'No Twitter Card', pass: 'fail' });
}

// 18-19. Duplicate titles and meta desc — flagged after all pages run, stored on result for now
// These are evaluated post-audit in renderSummary — store raw values for comparison
    const grade = score >= 85 ? 'A' : score >= 65 ? 'B' : score >= 45 ? 'C' : 'D';
    return { score, grade, metrics, title, slug, metaDesc: getMetaDescription(doc) };
  }

  // ─── Sitemap / Page Discovery ─────────────────────────────────
  async function discoverPages(baseUrl) {
    const sitemapUrls = [
      `${baseUrl}/sitemap.xml`,
      `${baseUrl}/sitemap_index.xml`,
      `${baseUrl}/page-sitemap.xml`,
    ];

    const isAuditablePage = url => {
      const skip = /\.(jpg|jpeg|png|gif|webp|svg|pdf|mp4|mp3|css|js|xml)(\?.*)?$/i;
      return url.startsWith('http') && !skip.test(url);
    };

    for (const sitemapUrl of sitemapUrls) {
      try {
        const { html } = await fetchHTML(sitemapUrl);
        const parser = new DOMParser();
        const xml = parser.parseFromString(html, 'application/xml');

        const childSitemaps = Array.from(xml.querySelectorAll('sitemap loc'))
          .map(el => el.textContent.trim())
          .filter(u => u.startsWith('http'));

        if (childSitemaps.length > 0) {
          const allPages = [];
          for (const childUrl of childSitemaps) {
            if (/image|video|news|asset/i.test(childUrl)) continue;
            try {
              const { html: childHtml } = await fetchHTML(childUrl);
const childXml = parser.parseFromString(childHtml, 'application/xml');
              const locs = Array.from(childXml.querySelectorAll('url loc'))
                .map(el => el.textContent.trim())
                .filter(isAuditablePage);
              allPages.push(...locs);
              if (allPages.length >= 10) break;
            } catch (e) { continue; }
          }
          if (allPages.length > 0) return allPages.slice(0, 10);
        }

        const locs = Array.from(xml.querySelectorAll('url loc'))
          .map(el => el.textContent.trim())
          .filter(isAuditablePage);

        if (locs.length > 0) return locs.slice(0, 10);
      } catch (e) { continue; }
    }

    return [baseUrl];
  }

  // ─── Render ───────────────────────────────────────────────────
  function renderSummary(results) {
    const avg    = Math.round(results.reduce((a, r) => a + r.score, 0) / results.length);
    const aCount = results.filter(r => r.grade === 'A').length;
    const dCount = results.filter(r => r.grade === 'D').length;

    $('summary').className = 'visible';
    $('summary').innerHTML = `
      <div class="summary-stat"><span class="val">${results.length}</span><span class="lbl">Pages Audited</span></div>
      <div class="summary-stat"><span class="val">${avg}</span><span class="lbl">Avg Score</span></div>
      <div class="summary-stat"><span class="val">${aCount}</span><span class="lbl">Grade A</span></div>
      <div class="summary-stat"><span class="val">${dCount}</span><span class="lbl">Critical</span></div>
    `;
  }

  function renderCard(result, url, index) {
    const container = $('pages-container');
    const wrapper   = document.createElement('div');
    wrapper.className = `card-grade-${result.grade}`;
    wrapper.style.animationDelay = `${index * 0.06}s`;

    const metricsHTML = result.metrics.map(m => `
      <span class="metric ${m.pass}">${m.label}</span>
    `).join('');

    const displayTitle = result.title || result.slug || url;
    const displaySlug  = new URL(url).pathname || '/';

    wrapper.innerHTML = `
      <div class="page-card">
        <div class="card-top">
          <div class="card-meta">
            <div class="page-id">Page ${String(index + 1).padStart(2, '0')}</div>
            <div class="page-title">${displayTitle}</div>
            <div class="page-slug">${displaySlug}</div>
          </div>
          <div class="score-badge">
            <span class="score-num">${result.score}</span>
            <div class="score-grade">Grade ${result.grade}</div>
          </div>
        </div>
        <div class="metrics">${metricsHTML}</div>
        <div class="score-bar-wrap">
          <div class="score-bar-fill" style="width:0%" data-width="${result.score}%"></div>
        </div>
      </div>
    `;

    container.appendChild(wrapper);

    requestAnimationFrame(() => {
      const bar = wrapper.querySelector('.score-bar-fill');
      requestAnimationFrame(() => { bar.style.width = bar.dataset.width; });
    });
  }

  // ─── Main Audit ───────────────────────────────────────────────
  async function runAudit() {
    let rawUrl = $('site-url').value.trim().replace(/\/$/, '');
    if (!rawUrl) return;
    if (!rawUrl.startsWith('http')) rawUrl = 'https://' + rawUrl;

    hideError();
    $('pages-container').innerHTML = '';
    $('summary').className = '';
    $('summary').innerHTML = '';
    $('audit-btn').disabled = true;

    const domain = new URL(rawUrl).hostname;

    try {
      setStatus(`Discovering pages on ${domain}...`);
      const pages = await discoverPages(rawUrl);
      setStatus(`Found ${pages.length} pages — starting audit...`);

      const results = [];

      for (let i = 0; i < pages.length; i++) {
        const pageUrl = pages[i];
        setStatus(`Auditing ${i + 1}/${pages.length} — ${new URL(pageUrl).pathname || '/'}`);
        try {
          const { html, responseTime, sizeKb } = await fetchHTML(pageUrl);
const doc = parseHTML(html);
const result = scorePage(doc, pageUrl, domain, responseTime, sizeKb);
          results.push({ ...result, url: pageUrl });
          renderCard(result, pageUrl, i);
        } catch (e) { continue; }
      }

      if (results.length === 0) throw new Error('Could not audit any pages. Site may be blocking requests.');

// Duplicate title detection
const titleCounts = {};
results.forEach(r => { if (r.title) titleCounts[r.title] = (titleCounts[r.title] || 0) + 1; });
const metaCounts = {};
results.forEach(r => { if (r.metaDesc) metaCounts[r.metaDesc] = (metaCounts[r.metaDesc] || 0) + 1; });

results.forEach(r => {
  if (r.title && titleCounts[r.title] > 1) {
    r.metrics.push({ label: 'Duplicate title', pass: 'fail' });
    r.score = Math.max(0, r.score - 8);
  }
  if (r.metaDesc && metaCounts[r.metaDesc] > 1) {
    r.metrics.push({ label: 'Duplicate meta desc', pass: 'fail' });
    r.score = Math.max(0, r.score - 8);
  }
  r.grade = r.score >= 85 ? 'A' : r.score >= 65 ? 'B' : r.score >= 45 ? 'C' : 'D';
});

results.sort((a, b) => b.score - a.score);
renderSummary(results);
      clearStatus();
      $('timestamp').textContent = `Audited at ${new Date().toLocaleTimeString()}`;

    } catch (err) {
      clearStatus();
      showError(err.message);
    } finally {
      $('audit-btn').disabled = false;
    }
  }

  // ─── Events ───────────────────────────────────────────────────
  $('audit-btn').addEventListener('click', runAudit);
  $('site-url').addEventListener('keydown', e => { if (e.key === 'Enter') runAudit(); });
</script>
