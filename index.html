<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEOX — SEO Auditor</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #030308;
      --deep: #0d0415;
      --card: #110820;
      --border: rgba(180, 0, 255, 0.2);
      --neon-purple: #b400ff;
      --neon-red: #ff003c;
      --neon-pink: #ff0080;
      --neon-violet: #7b00ff;
      --text: #e8d5ff;
      --muted: rgba(232,213,255,0.35);
      --mono: 'Share Tech Mono', monospace;
      --display: 'Orbitron', sans-serif;
      --body: 'Rajdhani', sans-serif;
      --glow-purple: 0 0 20px rgba(180,0,255,0.6), 0 0 60px rgba(180,0,255,0.2);
      --glow-red: 0 0 20px rgba(255,0,60,0.6), 0 0 60px rgba(255,0,60,0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--body);
      background: var(--black);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(180,0,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180,0,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(180,0,255,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: blobFloat 8s ease-in-out infinite;
    }

    @keyframes blobFloat {
      0%, 100% { transform: translate(0,0); }
      50% { transform: translate(80px, 60px); }
    }

    .blob2 {
      position: fixed;
      bottom: -200px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255,0,60,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: blobFloat2 10s ease-in-out infinite;
    }

    @keyframes blobFloat2 {
      0%, 100% { transform: translate(0,0); }
      50% { transform: translate(-60px, -80px); }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 2rem 6rem;
    }

    header {
      margin-bottom: 3.5rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2rem;
    }

    .logo {
      font-family: var(--display);
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, var(--neon-red), var(--neon-purple), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(180,0,255,0.5));
    }

    .tagline {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .audit-form {
      display: flex;
      gap: 0;
      margin-bottom: 3rem;
      position: relative;
    }

    .audit-form::before {
      content: '//';
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--neon-purple);
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 2;
    }

    #site-url {
      flex: 1;
      background: var(--deep);
      border: 1px solid var(--border);
      border-right: none;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.9rem;
      padding: 1rem 1rem 1rem 3rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      letter-spacing: 0.05em;
    }

    #site-url::placeholder { color: var(--muted); }
    #site-url:focus {
      border-color: var(--neon-purple);
      box-shadow: var(--glow-purple);
    }

    #audit-btn {
      background: linear-gradient(135deg, var(--neon-red), var(--neon-purple));
      border: none;
      color: #fff;
      font-family: var(--display);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 1rem 2rem;
      cursor: pointer;
      transition: filter 0.2s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }

    #audit-btn:hover { filter: brightness(1.3); }
    #audit-btn:active { transform: scale(0.98); }
    #audit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #status-bar {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--neon-purple);
      margin-bottom: 2rem;
      min-height: 1.2rem;
      letter-spacing: 0.1em;
      display: none;
    }

    #status-bar.visible { display: block; }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--neon-purple);
      margin-right: 8px;
      animation: pulse 1s ease-in-out infinite;
      vertical-align: middle;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    #summary {
      display: none;
      background: var(--deep);
      border: 1px solid var(--border);
      padding: 1.5rem 2rem;
      margin-bottom: 2.5rem;
      position: relative;
      overflow: hidden;
    }

    #summary::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--neon-red), var(--neon-purple), var(--neon-pink));
    }

    #summary.visible {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1.5rem;
    }

    .summary-stat { text-align: center; }

    .summary-stat .val {
      font-family: var(--display);
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-red), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: block;
    }

    .summary-stat .lbl {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    .page-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 1.8rem;
      margin-bottom: 1rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
      animation: cardIn 0.4s ease both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-card:hover { border-color: rgba(180,0,255,0.45); }

    .page-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
    }

    .card-grade-A .page-card::before { background: #00ff9f; box-shadow: 0 0 12px #00ff9f; }
    .card-grade-B .page-card::before { background: var(--neon-purple); box-shadow: var(--glow-purple); }
    .card-grade-C .page-card::before { background: #ff9f00; box-shadow: 0 0 12px #ff9f00; }
    .card-grade-D .page-card::before { background: var(--neon-red); box-shadow: var(--glow-red); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.2rem;
      gap: 1rem;
    }

    .page-id {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--neon-purple);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    .page-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.3rem;
      line-height: 1.3;
    }

    .page-slug {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }

    .score-badge { text-align: center; flex-shrink: 0; }

    .score-num {
      font-family: var(--display);
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
      display: block;
    }

    .card-grade-A .score-num { color: #00ff9f; text-shadow: 0 0 20px #00ff9f; }
    .card-grade-B .score-num { color: var(--neon-purple); text-shadow: var(--glow-purple); }
    .card-grade-C .score-num { color: #ff9f00; text-shadow: 0 0 20px #ff9f00; }
    .card-grade-D .score-num { color: var(--neon-red); text-shadow: var(--glow-red); }

    .score-grade {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.6rem;
    }

    .metric {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .metric-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .metric.pass .metric-dot { background: #00ff9f; box-shadow: 0 0 6px #00ff9f; }
    .metric.pass { color: rgba(232,213,255,0.7); }
    .metric.fail .metric-dot { background: var(--neon-red); box-shadow: 0 0 6px var(--neon-red); }
    .metric.partial .metric-dot { background: #ff9f00; box-shadow: 0 0 6px #ff9f00; }
    .metric.partial { color: rgba(232,213,255,0.7); }

    .score-bar-wrap {
      margin-top: 1.2rem;
      height: 3px;
      background: rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    }

    .card-grade-A .score-bar-fill { background: linear-gradient(90deg, #00ff9f, #00ffcc); }
    .card-grade-B .score-bar-fill { background: linear-gradient(90deg, var(--neon-violet), var(--neon-purple)); }
    .card-grade-C .score-bar-fill { background: linear-gradient(90deg, #ff6a00, #ff9f00); }
    .card-grade-D .score-bar-fill { background: linear-gradient(90deg, var(--neon-red), var(--neon-pink)); }

    #error-msg {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--neon-red);
      padding: 1rem;
      border: 1px solid rgba(255,0,60,0.3);
      display: none;
      letter-spacing: 0.05em;
    }

    #error-msg.visible { display: block; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--black); }
    ::-webkit-scrollbar-thumb { background: var(--neon-purple); }

    @media (max-width: 600px) {
      .logo { font-size: 1.5rem; }
      .audit-form { flex-direction: column; }
      #site-url { border-right: 1px solid var(--border); border-bottom: none; }
      #audit-btn { padding: 0.9rem; }
    }
  </style>
</head>
<body>

<div class="blob2"></div>

<div class="wrapper">
  <header>
    <div>
      <div class="logo">SEOX</div>
      <div class="tagline">On-Page SEO Auditor — Any Website</div>
    </div>
    <div class="tagline" id="timestamp"></div>
  </header>

  <div class="audit-form">
    <input type="text" id="site-url" placeholder="https://anywebsite.com" />
    <button id="audit-btn">Run Audit</button>
  </div>

  <div id="status-bar"><span class="status-dot"></span><span id="status-text">Initializing...</span></div>
  <div id="error-msg"></div>
  <div id="summary"></div>
  <div id="pages-container"></div>
</div>

<script>
  // ─── Utilities ────────────────────────────────────────────────
  const $ = id => document.getElementById(id);

  function setStatus(msg) {
    $('status-bar').classList.add('visible');
    $('status-text').textContent = msg;
  }

  function clearStatus() {
    $('status-bar').classList.remove('visible');
  }

  function showError(msg) {
    const el = $('error-msg');
    el.textContent = '// ERROR: ' + msg;
    el.classList.add('visible');
  }

  function hideError() {
    $('error-msg').classList.remove('visible');
  }

  // ─── Fetch page HTML via our Netlify function ─────────────────
  // We call our own /api/fetch-page endpoint, passing the target URL as a parameter.
  // Our Netlify function runs server-side, fetches the HTML with real browser headers,
  // and returns it to us. No CORS issues, no 403s from proxy IPs.
  async function fetchHTML(url) {
    const endpoint = `/api/fetch-page?url=${encodeURIComponent(url)}`;
    const res = await fetch(endpoint);
    if (!res.ok) throw new Error(`Function returned ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data.html;
  }

  // ─── HTML Parsers ─────────────────────────────────────────────
  // We use the browser's built-in DOMParser to parse raw HTML strings
  // into a real DOM tree we can query — exactly like document.querySelector
  // but on a separate document object, not the current page.
  function parseHTML(html) {
    const parser = new DOMParser();
    return parser.parseFromString(html, 'text/html');
  }

  function getTitle(doc) {
    // <title> tag in <head>
    return (doc.querySelector('title')?.textContent || '').trim();
  }

  function getMetaDescription(doc) {
    // <meta name="description" content="...">
    return (doc.querySelector('meta[name="description"]')?.getAttribute('content') || '').trim();
  }

  function getH1s(doc) {
    return doc.querySelectorAll('h1');
  }

  function getH2s(doc) {
    return doc.querySelectorAll('h2');
  }

  function getH3s(doc) {
    return doc.querySelectorAll('h3');
  }

  function getImages(doc) {
    return doc.querySelectorAll('img');
  }

  function getCanonical(doc) {
    return doc.querySelector('link[rel="canonical"]')?.getAttribute('href') || '';
  }

  function getRobotsMeta(doc) {
    return doc.querySelector('meta[name="robots"]')?.getAttribute('content') || '';
  }

  function hasSchema(doc) {
    return !!doc.querySelector('script[type="application/ld+json"]');
  }

  function getWordCount(doc) {
    // Get text from body, strip tags, count words
    const body = doc.body?.innerText || doc.body?.textContent || '';
    return body.trim().split(/\s+/).filter(w => w.length > 0).length;
  }

  function getInternalLinks(doc, domain) {
    const links = doc.querySelectorAll('a[href]');
    let internal = 0;
    links.forEach(link => {
      const href = link.getAttribute('href') || '';
      if (href.includes(domain) || href.startsWith('/')) internal++;
    });
    return internal;
  }

  function getExternalLinks(doc, domain) {
    const links = doc.querySelectorAll('a[href]');
    let external = 0;
    links.forEach(link => {
      const href = link.getAttribute('href') || '';
      if (href.startsWith('http') && !href.includes(domain)) external++;
    });
    return external;
  }

  function getViewport(doc) {
    return doc.querySelector('meta[name="viewport"]')?.getAttribute('content') || '';
  }

  function getOpenGraph(doc) {
    const ogTitle = doc.querySelector('meta[property="og:title"]')?.getAttribute('content') || '';
    const ogDesc = doc.querySelector('meta[property="og:description"]')?.getAttribute('content') || '';
    const ogImage = doc.querySelector('meta[property="og:image"]')?.getAttribute('content') || '';
    return { ogTitle, ogDesc, ogImage };
  }

  function isSlugClean(slug) {
    const stopWords = ['and','the','of','in','a','to','for','on','with','is','it','at','by','or'];
    const parts = slug.split('-').filter(Boolean);
    const hasStop = parts.some(p => stopWords.includes(p.toLowerCase()));
    const tooLong = slug.length > 75;
    const hasNumbers = /\d{4,}/.test(slug);
    return !hasStop && !tooLong && !hasNumbers;
  }

  // ─── Scoring Engine ───────────────────────────────────────────
  // Each metric returns { label, pass: 'pass'|'partial'|'fail', points }
  // Max total: 100 points
  function scorePage(doc, url, domain) {
    const metrics = [];
    let score = 0;

    const title = getTitle(doc);
    const metaDesc = getMetaDescription(doc);
    const h1s = getH1s(doc);
    const h2s = getH2s(doc);
    const h3s = getH3s(doc);
    const images = getImages(doc);
    const canonical = getCanonical(doc);
    const robots = getRobotsMeta(doc);
    const schema = hasSchema(doc);
    const wordCount = getWordCount(doc);
    const internalLinks = getInternalLinks(doc, domain);
    const externalLinks = getExternalLinks(doc, domain);
    const viewport = getViewport(doc);
    const og = getOpenGraph(doc);

    // Parse slug from URL
    const urlObj = new URL(url);
    const slug = urlObj.pathname.replace(/^\/|\/$/g, '') || 'homepage';
    const imagesWithAlt = Array.from(images).filter(img => (img.getAttribute('alt') || '').trim().length > 1);

    // 1. Title tag — 10pts
    if (title && title.length >= 30 && title.length <= 60) {
      score += 10; metrics.push({ label: `Title (${title.length} chars)`, pass: 'pass' });
    } else if (title && title.length > 0) {
      score += 5; metrics.push({ label: `Title (${title.length} chars — not optimal)`, pass: 'partial' });
    } else {
      metrics.push({ label: 'Title tag missing', pass: 'fail' });
    }

    // 2. Meta description — 10pts
    if (metaDesc && metaDesc.length >= 120 && metaDesc.length <= 160) {
      score += 10; metrics.push({ label: `Meta desc (${metaDesc.length} chars)`, pass: 'pass' });
    } else if (metaDesc && metaDesc.length > 0) {
      score += 5; metrics.push({ label: `Meta desc (${metaDesc.length} chars — not optimal)`, pass: 'partial' });
    } else {
      metrics.push({ label: 'Meta description missing', pass: 'fail' });
    }

    // 3. H1 tag — 10pts
    if (h1s.length === 1) {
      score += 10; metrics.push({ label: 'H1 tag (1 found)', pass: 'pass' });
    } else if (h1s.length > 1) {
      score += 4; metrics.push({ label: `H1 overused (${h1s.length} found)`, pass: 'partial' });
    } else {
      metrics.push({ label: 'No H1 tag found', pass: 'fail' });
    }

    // 4. H2/H3 structure — 5pts
    if (h2s.length >= 2) {
      score += 5; metrics.push({ label: `Heading structure (${h2s.length} H2s, ${h3s.length} H3s)`, pass: 'pass' });
    } else if (h2s.length === 1) {
      score += 3; metrics.push({ label: `Minimal headings (${h2s.length} H2)`, pass: 'partial' });
    } else {
      metrics.push({ label: 'No H2/H3 structure', pass: 'fail' });
    }

    // 5. Word count — 10pts
    if (wordCount >= 600) {
      score += 10; metrics.push({ label: `Content depth (${wordCount} words)`, pass: 'pass' });
    } else if (wordCount >= 200) {
      score += 5; metrics.push({ label: `Thin content (${wordCount} words)`, pass: 'partial' });
    } else {
      metrics.push({ label: `Very thin (${wordCount} words)`, pass: 'fail' });
    }

    // 6. Image alt text — 10pts
    if (images.length === 0) {
      score += 5; metrics.push({ label: 'No images (neutral)', pass: 'partial' });
    } else if (imagesWithAlt.length === images.length) {
      score += 10; metrics.push({ label: `Alt text (${imagesWithAlt.length}/${images.length} images)`, pass: 'pass' });
    } else if (imagesWithAlt.length > 0) {
      score += 5; metrics.push({ label: `Alt text (${imagesWithAlt.length}/${images.length} images)`, pass: 'partial' });
    } else {
      metrics.push({ label: `No alt text (0/${images.length} images)`, pass: 'fail' });
    }

    // 7. Internal links — 8pts
    if (internalLinks >= 5) {
      score += 8; metrics.push({ label: `Internal links (${internalLinks})`, pass: 'pass' });
    } else if (internalLinks >= 2) {
      score += 4; metrics.push({ label: `Few internal links (${internalLinks})`, pass: 'partial' });
    } else {
      metrics.push({ label: 'No internal links', pass: 'fail' });
    }

    // 8. External links — 4pts
    if (externalLinks >= 1) {
      score += 4; metrics.push({ label: `External links (${externalLinks})`, pass: 'pass' });
    } else {
      metrics.push({ label: 'No external links', pass: 'fail' });
    }

    // 9. Canonical tag — 8pts
    if (canonical) {
      score += 8; metrics.push({ label: 'Canonical tag set', pass: 'pass' });
    } else {
      metrics.push({ label: 'No canonical tag', pass: 'fail' });
    }

    // 10. Robots meta — 5pts
    if (!robots || (!robots.includes('noindex') && !robots.includes('nofollow'))) {
      score += 5; metrics.push({ label: 'Robots: indexable', pass: 'pass' });
    } else {
      metrics.push({ label: `Robots: ${robots}`, pass: 'fail' });
    }

    // 11. Schema markup — 5pts
    if (schema) {
      score += 5; metrics.push({ label: 'Schema markup (JSON-LD)', pass: 'pass' });
    } else {
      metrics.push({ label: 'No schema markup', pass: 'fail' });
    }

    // 12. Viewport / mobile — 5pts
    if (viewport && viewport.includes('width=device-width')) {
      score += 5; metrics.push({ label: 'Mobile viewport set', pass: 'pass' });
    } else {
      metrics.push({ label: 'No mobile viewport', pass: 'fail' });
    }

    // 13. Open Graph tags — 5pts
    if (og.ogTitle && og.ogImage) {
      score += 5; metrics.push({ label: 'Open Graph tags set', pass: 'pass' });
    } else if (og.ogTitle || og.ogImage) {
      score += 2; metrics.push({ label: 'Open Graph incomplete', pass: 'partial' });
    } else {
      metrics.push({ label: 'No Open Graph tags', pass: 'fail' });
    }

    // 14. Clean slug — 5pts
    if (slug === 'homepage' || isSlugClean(slug)) {
      score += 5; metrics.push({ label: 'Clean URL slug', pass: 'pass' });
    } else {
      metrics.push({ label: 'Slug needs work', pass: 'fail' });
    }

    const grade = score >= 85 ? 'A' : score >= 65 ? 'B' : score >= 45 ? 'C' : 'D';
    return { score, grade, metrics, title, slug };
  }

  // ─── Sitemap / Page Discovery ─────────────────────────────────
  // We fetch the sitemap to discover all pages on the site.
  // Most sites have a sitemap at /sitemap.xml or /sitemap_index.xml.
  // We extract <loc> tags which contain individual page URLs.
  async function discoverPages(baseUrl) {
    const sitemapUrls = [
      `${baseUrl}/sitemap.xml`,
      `${baseUrl}/sitemap_index.xml`,
      `${baseUrl}/page-sitemap.xml`,
    ];

    for (const sitemapUrl of sitemapUrls) {
      try {
        const html = await fetchHTML(sitemapUrl);
        // Parse XML sitemap — extract all <loc> tags
        const parser = new DOMParser();
        const xml = parser.parseFromString(html, 'application/xml');
        const locs = Array.from(xml.querySelectorAll('loc'))
          .map(el => el.textContent.trim())
          .filter(url => {
  const skip = /\.(jpg|jpeg|png|gif|webp|svg|pdf|mp4|mp3|css|js)(\?.*)?$/i;
  return url.startsWith('http') && !skip.test(url);
});

        if (locs.length > 0) return locs.slice(0, 10); // audit up to 10 pages
      } catch (e) {
        continue;
      }
    }

    // Fallback: just audit the homepage
    return [baseUrl];
  }

  // ─── Render ───────────────────────────────────────────────────
  function renderSummary(results) {
    const avg = Math.round(results.reduce((a, r) => a + r.score, 0) / results.length);
    const aCount = results.filter(r => r.grade === 'A').length;
    const dCount = results.filter(r => r.grade === 'D').length;

    $('summary').className = 'visible';
    $('summary').innerHTML = `
      <div class="summary-stat"><span class="val">${results.length}</span><span class="lbl">Pages Audited</span></div>
      <div class="summary-stat"><span class="val">${avg}</span><span class="lbl">Avg Score</span></div>
      <div class="summary-stat"><span class="val">${aCount}</span><span class="lbl">Grade A Pages</span></div>
      <div class="summary-stat"><span class="val">${dCount}</span><span class="lbl">Critical Issues</span></div>
    `;
  }

  function renderCard(result, url, index) {
    const container = $('pages-container');
    const wrapper = document.createElement('div');
    wrapper.className = `card-grade-${result.grade}`;
    wrapper.style.animationDelay = `${index * 0.07}s`;

    const metricsHTML = result.metrics.map(m => `
      <div class="metric ${m.pass}">
        <span class="metric-dot"></span>
        <span>${m.label}</span>
      </div>
    `).join('');

    const displayTitle = result.title || result.slug || url;
    const displaySlug = new URL(url).pathname || '/';

    wrapper.innerHTML = `
      <div class="page-card">
        <div class="card-top">
          <div class="card-meta">
            <div class="page-id">PAGE ${index + 1}</div>
            <div class="page-title">${displayTitle}</div>
            <div class="page-slug">${displaySlug}</div>
          </div>
          <div class="score-badge">
            <span class="score-num">${result.score}</span>
            <div class="score-grade">Grade ${result.grade}</div>
          </div>
        </div>
        <div class="metrics">${metricsHTML}</div>
        <div class="score-bar-wrap">
          <div class="score-bar-fill" style="width:0%" data-width="${result.score}%"></div>
        </div>
      </div>
    `;

    container.appendChild(wrapper);

    requestAnimationFrame(() => {
      const bar = wrapper.querySelector('.score-bar-fill');
      requestAnimationFrame(() => { bar.style.width = bar.dataset.width; });
    });
  }

  // ─── Main Audit ───────────────────────────────────────────────
  async function runAudit() {
    let rawUrl = $('site-url').value.trim().replace(/\/$/, '');
    if (!rawUrl) return;
    if (!rawUrl.startsWith('http')) rawUrl = 'https://' + rawUrl;

    hideError();
    $('pages-container').innerHTML = '';
    $('summary').className = '';
    $('summary').innerHTML = '';
    $('audit-btn').disabled = true;

    const domain = new URL(rawUrl).hostname;

    try {
      setStatus(`Discovering pages on ${domain}...`);
      const pages = await discoverPages(rawUrl);

      setStatus(`Found ${pages.length} pages — starting audit...`);

      const results = [];

      for (let i = 0; i < pages.length; i++) {
        const pageUrl = pages[i];
        setStatus(`Auditing page ${i + 1} of ${pages.length}: ${new URL(pageUrl).pathname || '/'}`);
        try {
          const html = await fetchHTML(pageUrl);
          const doc = parseHTML(html);
          const result = scorePage(doc, pageUrl, domain);
          results.push({ ...result, url: pageUrl });
          // Render cards as they come in, one by one
          renderCard(result, pageUrl, i);
        } catch (e) {
          // Skip pages that fail individually
          continue;
        }
      }

      if (results.length === 0) throw new Error('Could not audit any pages. Site may be blocking requests.');

      results.sort((a, b) => b.score - a.score);
      renderSummary(results);
      clearStatus();
      $('timestamp').textContent = `Audited ${new Date().toLocaleTimeString()}`;

    } catch (err) {
      clearStatus();
      showError(err.message);
    } finally {
      $('audit-btn').disabled = false;
    }
  }

  // ─── Events ───────────────────────────────────────────────────
  $('audit-btn').addEventListener('click', runAudit);
  $('site-url').addEventListener('keydown', e => { if (e.key === 'Enter') runAudit(); });
</script>

</body>
